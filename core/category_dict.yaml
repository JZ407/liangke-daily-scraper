categories:
  资本运作:
    strong_signals:
    - pattern: "(完成|获|获得|宣布|签署|达成).{0,10}(轮融资|元融资)"
      scope: title
    - pattern: "天使轮|种子轮|A轮|B轮|C轮|D轮|Pre-IPO"
      scope: title
    - pattern: "(拟|计划|已|正式|宣布|提交).{0,8}(借壳上市|IPO上市|SPAC|上市申请)"
      scope: title
    - pattern: "SPAC"
      scope: title
    - pattern: "(收购|并购|合并|控股|注资|参股).{0,10}(公司|企业|正式|完成|宣布|交易|旗下)"
      scope: any
    positives:
      融资: 5
      IPO: 5
      收购: 4
      并购: 4
      估值: 3
      亿美元: 3
      亿欧元: 3
      亿元: 2
      注资: 3
      投资人: 2
      财报: 3
      营收: 2
      投资: 1
      资金支持: 1
    negatives:
      投资布局: -2
      教育投资: -3
      人才投资: -3
    priority: 1
  科技前沿:
    strong_signals:
    - pattern: "arXiv|预印本|《自然》|《科学》"
      scope: any
    - pattern: "Nature|PRL|Physical Review|Phys\\. Rev\\.|Nat\\."
      scope: any
    positives:
      量子纠错: 5
      量子密钥分发: 5
      量子算法: 5
      量子纠错码: 5
      qLDPC: 5
      容错量子: 5
      量子模拟: 4
      量子传感: 4
      量子热力学: 4
      量子纠缠: 4
      量子态: 4
      量子门: 4
      量子线路: 4
      哈密顿: 3
      自旋: 3
      光子: 2
      超导量子: 3
      离子阱: 3
      中性原子: 3
      硅自旋: 3
      量子比特: 2
      变分量子: 3
      量子资源理论: 4
    negatives:
      产品发布: -3
      量产: -3
      部署: -2
      商用: -2
    priority: 2
  产品动态:
    strong_signals:
    - pattern: "(发布|推出|发布全新|正式发布).{0,10}(芯片|处理器|计算机|平台|系统|服务)"
      scope: title
    - pattern: "产品上市|新品上市|正式上市销售"
      scope: title
    - pattern: "(发布|推出).{0,5}(量子计算机|量子芯片|量子处理器|量子云)"
      scope: title
    positives:
      发布: 3
      推出: 3
      产品发布: 4
      量子计算机: 3
      芯片: 3
      处理器: 3
      云服务: 3
      量产: 3
      商用: 2
      部署: 2
      产品: 2
      性能: 2
      保真度: 2
      升级: 2
      平台: 1
    negatives:
      论文: -4
      arXiv: -5
      预印本: -5
      Nature: -5
      PRL: -5
      融资: -3
      任命: -2
    priority: 3
  企业资讯:
    strong_signals:
    - pattern: (任命|晋升|提升为).*(首席|CEO|董事长|总裁|主席|董事|合伙人|研究员)
    - pattern: (设立|成立|组建).*?(总部|子公司|联盟|协会|公司)
    - pattern: (签署|签订).*?(协议|备忘录|谅解备忘录)
    - pattern: (携手|与.*合作).*?(推出|开发|发布|强化|集成|融合)
    - pattern: 荣获.*?(奖项|奖|荣誉)
    positives:
      任命: 5
      晋升: 5
      总裁: 5
      CEO: 5
      合伙人: 5
      总部: 5
      子公司: 5
      联盟: 5
      签署: 5
      携手: 4
      合作: 3
      设立: 5
      奖项: 5
      基金: 4
      产业化: 5
    negatives:
      该团队: -3
      提出了一种协议: -3
      层析成像: -2
      连续变量: -2
      反射镜: -1
    priority: 4
  宏观态势:
    strong_signals:
    - pattern: "启动.*(计划|项目|任务|量子加速器|研究院|研讨会)"
    - pattern: "(走访调研|领导.*调研|调研.*企业)"
    - pattern: ".*(大学|学院).*成立.*(研究院|学院|中心)"
    - pattern: "(路线图|研讨会).*(启动|召开|将)"
    - pattern: "(国家|国务院|欧盟|白宫|科技部|工信部).*(发布|出台|推出|宣布).*(政策|战略|规划|计划|法案|倡议)"
    positives:
      国家量子: 5
      政策: 4
      战略: 3
      路线图: 4
      项目: 3
      资助: 3
      教育: 3
      产学研: 3
      产业: 2
      出口管制: 4
      白皮书: 4
      市场报告: 3
      人才: 3
      调研: 3
      计划: 3
      规划: 4
      发布: 1
    negatives:
      模型: -3
      方法: -3
      效应: -3
      方程: -3
      理论: -2
    priority: 5
